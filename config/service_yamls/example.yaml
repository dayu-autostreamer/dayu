# Illustrative managed-runtime resources. Backend renders real names, images,
# install IDs, node names and bootstrap endpoints transactionally at install time.
apiVersion: sedna.io/v1alpha1
kind: RuntimeService
metadata:
  name: processor-face-detection-edge1-7d6d35c501-r1
  namespace: dayu
  labels:
    app.kubernetes.io/managed-by: dayu-backend
    app.kubernetes.io/part-of: dayu
    dayu.io/component: processor
    dayu.io/install-id: example-install
    dayu.io/runtime-scope: installation
spec:
  installID: example-install
  deploymentRevision: 1
  component: processor
  logicalService: face-detection
  targetNode: edge1
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/managed-by: dayu-backend
        app.kubernetes.io/part-of: dayu
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Always
      dnsPolicy: ClusterFirst
      containers:
        - name: processor
          image: repo:5000/dayuhub/processor:v1.4
          imagePullPolicy: Always
          env:
            - name: NODE_NAME
              value: edge1
            - name: PROCESSOR_SERVICE_NAME
              value: processor-face-detection
            - name: GUNICORN_PORT
              value: "9000"
            - name: DAYU_RUNTIME_BOOTSTRAP
              value: >-
                {"mode":"runtime-service","namespace":"dayu","install_id":"example-install","local_node":"edge1","cloud_node":"cloud1","lease_ttl_seconds":3600,"nodes":{"cloud1":{"role":"cloud","ready":true},"edge1":{"role":"edge","ready":true}},"endpoints":[{"component":"scheduler","target_node":"cloud1","runtime_id":"scheduler-cloud1-example-r1","fqdn":"scheduler-cloud1-example-r1.dayu.svc.cluster.local","port":9000},{"component":"redis","target_node":"cloud1","runtime_id":"redis","fqdn":"redis-cloud.dayu.svc.cluster.local","port":6379}]}
          ports:
            - name: runtime
              containerPort: 9000
              protocol: TCP
  endpoint:
    port: 9000
---
apiVersion: sedna.io/v1alpha1
kind: RuntimeService
metadata:
  name: generator-source-0-edge1-1e3b53122e-r1
  namespace: dayu
  labels:
    app.kubernetes.io/managed-by: dayu-backend
    app.kubernetes.io/part-of: dayu
    dayu.io/component: generator
    dayu.io/install-id: example-install
    dayu.io/runtime-scope: installation
spec:
  installID: example-install
  deploymentRevision: 1
  component: generator
  targetNode: edge1
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/managed-by: dayu-backend
        app.kubernetes.io/part-of: dayu
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Always
      dnsPolicy: ClusterFirst
      containers:
        - name: generator
          image: repo:5000/dayuhub/generator:v1.4
          imagePullPolicy: Always
          env:
            - name: SOURCE_ID
              value: "0"
            - name: NODE_NAME
              value: edge1
            - name: DAYU_RUNTIME_BOOTSTRAP
              value: >-
                {"mode":"runtime-service","namespace":"dayu","install_id":"example-install","local_node":"edge1","cloud_node":"cloud1","lease_ttl_seconds":3600,"nodes":{"cloud1":{"role":"cloud","ready":true},"edge1":{"role":"edge","ready":true}},"endpoints":[{"component":"scheduler","target_node":"cloud1","runtime_id":"scheduler-cloud1-example-r1","fqdn":"scheduler-cloud1-example-r1.dayu.svc.cluster.local","port":9000}]}
# Generator has no endpoint: it only initiates outbound requests.
