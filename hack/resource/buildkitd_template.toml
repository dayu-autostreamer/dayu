# Template of buildkitd.toml for docker buildx.
# Default buildkitd.toml is empty.
# If you want to use http registry, please modify buildkitd.toml as the following templates.


# use http registry
[registry."repo:5000"]
  http = true
  insecure = true

[registry."114.212.87.136:5000"]
  http = true
  insecure = true

# Limit concurrent BuildKit operations on memory-constrained build hosts.
# A value of 2 is recommended for a host with about 10 GiB of memory when
# building Dayu's amd64 and arm64 images together. Increase it cautiously on
# larger hosts, or lower it if the kernel still reports OOM kills.
[worker.oci]
  max-parallelism = 2
