name: Dayu Release Images
run-name: Build and push Dayu images for ${{ github.event.release.tag_name }}

# Docker images are release artifacts. A stable, published GitHub Release is the
# only supported entry point; ordinary pushes, pull requests, schedules, and
# manual dispatches never publish images.
on:
  release:
    types:
      - published

concurrency:
  group: dockerhub-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  release-gate:
    name: Stable release and exact-SHA CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.check.outputs.release_tag }}
      target_sha: ${{ steps.check.outputs.target_sha }}
    steps:
      - id: check
        name: Validate the release tag and its main push CI
        uses: actions/github-script@v7
        env:
          DEFAULT_BRANCH: main
          REQUIRED_WORKFLOW_FILE: ci.yml
          RELEASE_TAG_PATTERN: '^v[0-9]+\.[0-9]+(\.[0-9]+)?$'
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const release = context.payload.release;
            const defaultBranch = process.env.DEFAULT_BRANCH;
            const requiredWorkflowFile = process.env.REQUIRED_WORKFLOW_FILE;
            const releaseTagPattern = new RegExp(process.env.RELEASE_TAG_PATTERN);

            function fail(reason) {
              core.setFailed(reason);
              return false;
            }

            if (!release) {
              return fail('The workflow must be triggered by a published GitHub Release.');
            }

            const releaseTag = release.tag_name;

            if (release.draft) {
              return fail(`Release ${releaseTag} is still a draft.`);
            }

            if (release.prerelease) {
              return fail(
                `Release ${releaseTag} is marked as a prerelease. Only stable releases may publish Docker images.`
              );
            }

            if (!releaseTagPattern.test(releaseTag)) {
              return fail(
                `Release tag "${releaseTag}" is invalid. Expected vMAJOR.MINOR or vMAJOR.MINOR.PATCH.`
              );
            }

            let tagRef;
            try {
              const response = await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${releaseTag}`,
              });
              tagRef = response.data;
            } catch (error) {
              return fail(`Cannot resolve release tag "${releaseTag}": ${error.message}`);
            }

            if (tagRef.object.type !== 'tag') {
              return fail(
                `Release tag "${releaseTag}" must be an annotated tag; lightweight tags are not accepted.`
              );
            }

            let tagObject;
            try {
              const response = await github.rest.git.getTag({
                owner,
                repo,
                tag_sha: tagRef.object.sha,
              });
              tagObject = response.data;
            } catch (error) {
              return fail(`Cannot read annotated tag "${releaseTag}": ${error.message}`);
            }

            if (tagObject.tag !== releaseTag) {
              return fail(
                `Annotated tag name mismatch: expected "${releaseTag}", received "${tagObject.tag}".`
              );
            }

            if (tagObject.object.type !== 'commit') {
              return fail(
                `Annotated tag "${releaseTag}" must point directly to a commit, not ${tagObject.object.type}.`
              );
            }

            const targetSha = tagObject.object.sha;

            if (context.sha !== targetSha) {
              return fail(
                `Release event SHA ${context.sha} does not match tag commit ${targetSha}.`
              );
            }

            let comparison;
            try {
              const response = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${targetSha}...${defaultBranch}`,
              });
              comparison = response.data;
            } catch (error) {
              return fail(
                `Cannot verify that ${targetSha} belongs to ${defaultBranch}: ${error.message}`
              );
            }

            if (!['ahead', 'identical'].includes(comparison.status)) {
              return fail(
                `Tag ${releaseTag} points to ${targetSha}, which is not on ${defaultBranch}.`
              );
            }

            let workflowRuns;
            try {
              workflowRuns = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                {
                  owner,
                  repo,
                  workflow_id: requiredWorkflowFile,
                  branch: defaultBranch,
                  head_sha: targetSha,
                  per_page: 100,
                }
              );
            } catch (error) {
              return fail(
                `Cannot inspect ${requiredWorkflowFile} runs for ${targetSha}: ${error.message}`
              );
            }

            const matchingRuns = workflowRuns
              .filter((run) =>
                run.event === 'push' &&
                run.head_branch === defaultBranch &&
                run.head_sha === targetSha
              )
              .sort((left, right) =>
                new Date(right.updated_at).getTime() - new Date(left.updated_at).getTime()
              );

            const successfulRun = matchingRuns.find((run) =>
              run.status === 'completed' && run.conclusion === 'success'
            );

            if (!successfulRun) {
              const observed = matchingRuns.length === 0
                ? 'no matching push run was found'
                : matchingRuns
                    .slice(0, 5)
                    .map((run) => `#${run.run_number}: ${run.status}/${run.conclusion ?? 'none'}`)
                    .join(', ');

              return fail(
                `Release blocked: ${requiredWorkflowFile} has no successful push-to-${defaultBranch} run for exact commit ${targetSha} (${observed}).`
              );
            }

            core.setOutput('release_tag', releaseTag);
            core.setOutput('target_sha', targetSha);

            await core.summary
              .addHeading('Release image gate passed')
              .addTable([
                [{ data: 'Check', header: true }, { data: 'Value', header: true }],
                ['Release tag', releaseTag],
                ['Release commit', targetSha],
                ['Required CI run', `#${successfulRun.run_number}`],
                ['CI event / branch', `${successfulRun.event} / ${successfulRun.head_branch}`],
              ])
              .addLink('Open the successful CI run', successfulRun.html_url)
              .write();

  build-and-push:
    name: make all (buildx + push)
    runs-on: dayu-runner
    needs:
      - release-gate
    env:
      REG: docker.io
      REPO: ${{ vars.DOCKERHUB_REPO || secrets.DOCKERHUB_USERNAME }}
      RELEASE_TAG: ${{ needs.release-gate.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.release-gate.outputs.target_sha }}
    steps:
      - name: Check out the released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate build configuration
        run: make validate-build

      - name: Build and push release images
        run: >-
          make all
          REG="${REG}"
          REPO="${REPO}"
          TAG="${RELEASE_TAG}"
