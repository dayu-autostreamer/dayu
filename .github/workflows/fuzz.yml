name: Fuzz

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "21 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [dag, schedule_plan, runtime_routes]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.8"

      - name: Install isolated fuzz dependencies
        run: |
          python -m pip install --only-binary=:all: -r tests/fuzz/requirements.txt

      - name: Run bounded coverage-guided fuzzing
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '600' || github.event_name == 'pull_request' && '60' || '120' }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: python tools/run_fuzz.py --target "$FUZZ_TARGET" --seconds "$FUZZ_SECONDS"

      - name: Preserve logs, corpus and failure inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_attempt }}
          path: .cache/fuzz/${{ matrix.target }}/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
