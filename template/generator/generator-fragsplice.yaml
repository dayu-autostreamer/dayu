position: edge
pod-template:
  image: generator
  imagePullPolicy: Always
  env:
    - name: GEN_FILTER_NAME
      value: simple
    - name: GEN_GETTER_FILTER_NAME
      value: scheduler_permitted
    - name: GEN_GETTER_FILTER_PARAMETERS
      value: >
        {
          'fail_open': False,
          'timeout_s': 2.0,
          'log_interval_s': 10.0
        }
    - name: GEN_PROCESS_NAME
      value: simple
    - name: GEN_COMPRESS_NAME
      value: simple
    - name: GEN_BSO_NAME
      value: simple
    - name: GEN_BSTO_NAME
      value: simple
    - name: GEN_ASO_NAME
      value: simple
    # FragSplice commits one immutable full-DAG plan for every generated task.
    - name: REQUEST_SCHEDULING_INTERVAL
      value: "0"
