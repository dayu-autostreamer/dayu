position: both
pod-template:
  image: vehicle-reidentification-tracking
  imagePullPolicy: Always
  env:
    - name: PROCESSOR_NAME
      value: "structured_processor"
    - name: APPLICATION_PARAMETERS
      value: >
        {
          'model_name':'vehicle-reidentification-tracker',
          'model_weight':'vehicle_reidentification_tracking.pt',
          'model_variant':'bytetrack-reidentification',
          'device':0,
          'synthetic_complexity':2
        }
    - name: INPUT_SERVICES
      value: >
        []
    - name: SCENARIOS_EXTRACTORS
      value: >
        ['structured_profile']
    - name: PRO_QUEUE_NAME
      value: "simple"
port-open:
  pos: both
  port: 9000
file-mount:
  - pos: both
    path: "processor/vehicle-reidentification-tracking/"
