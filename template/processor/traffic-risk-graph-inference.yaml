position: both
pod-template:
  image: traffic-risk-graph-inference
  imagePullPolicy: Always
  env:
    - name: PROCESSOR_NAME
      value: "structured_processor"
    - name: APPLICATION_PARAMETERS
      value: >
        {
          'model_name':'traffic-risk-graph-model',
          'model_weight':'traffic_risk_graph_inference.pt',
          'model_variant':'graph-transformer',
          'device':0,
          'synthetic_complexity':4
        }
    - name: INPUT_SERVICES
      value: >
        []
    - name: SCENARIOS_EXTRACTORS
      value: >
        ['structured_profile']
    - name: PRO_QUEUE_NAME
      value: "simple"
port-open:
  pos: both
  port: 9000
file-mount:
  - pos: both
    path: "processor/traffic-risk-graph-inference/"
