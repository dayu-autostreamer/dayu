position: both
pod-template:
  image: traffic-signal-recognition
  imagePullPolicy: Always
  env:
    - name: PROCESSOR_NAME
      value: "structured_processor"
    - name: APPLICATION_PARAMETERS
      value: >
        {
          'model_name':'traffic-signal-classifier',
          'model_weight':'traffic_signal_recognition.pt',
          'model_variant':'mobilenetv3',
          'device':0,
          'synthetic_complexity':1
        }
    - name: INPUT_SERVICES
      value: >
        []
    - name: SCENARIOS_EXTRACTORS
      value: >
        ['structured_profile']
    - name: PRO_QUEUE_NAME
      value: "simple"
port-open:
  pos: both
  port: 9000
file-mount:
  - pos: both
    path: "processor/traffic-signal-recognition/"
